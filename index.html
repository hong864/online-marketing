<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>시선인터내셔널 AD Report 대시보드</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js" integrity="sha384-iU8HYtnGQ8Cy4zl7gbNMOhsDTTKX02BTXptVP/vqAWIaTfM7isw76iyZCsjL2eVi" crossorigin="anonymous"></script>
<style>
  :root{
    color-scheme: light;
    --bg:#f4f5f8; --card:#ffffff; --ink:#1a1d29; --muted:#717684; --line:#e7e9ef;
    --indigo:#4f46e5; --green:#10b981; --amber:#f59e0b; --rose:#f43f5e; --sky:#0ea5e9; --violet:#8b5cf6;
    --shadow:0 1px 3px rgba(20,23,40,.06),0 1px 2px rgba(20,23,40,.04);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1180px;margin:0 auto;padding:20px 18px 60px}
  header{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;margin-bottom:6px}
  header h1{font-size:20px;font-weight:700;margin:0}
  header .month{font-size:15px;font-weight:600;color:var(--indigo)}
  header .gen{font-size:12px;color:var(--muted);margin-left:auto}
  .tabs{display:flex;gap:4px;flex-wrap:wrap;margin:16px 0 18px;border-bottom:1px solid var(--line)}
  .tab{padding:9px 16px;border:none;background:none;cursor:pointer;font-size:14px;font-weight:600;
    color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;border-radius:6px 6px 0 0}
  .tab:hover{color:var(--ink);background:#eef0f6}
  .tab.active{color:var(--indigo);border-bottom-color:var(--indigo)}
  .panel{display:none;animation:fade .25s ease}
  .panel.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .grid{display:grid;gap:14px}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(155px,1fr))}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
  .kpi .label{font-size:12px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:5px}
  .kpi .val{font-size:22px;font-weight:700;margin-top:6px;letter-spacing:-.4px}
  .kpi .sub{font-size:11.5px;color:var(--muted);margin-top:3px}
  .kpi .bar{display:inline-block;width:6px;height:6px;border-radius:2px;margin-right:1px}
  .cards{grid-template-columns:repeat(auto-fit,minmax(320px,1fr));margin-top:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow)}
  .card h3{margin:0 0 12px;font-size:14px;font-weight:700}
  .card h3 .hint{font-weight:500;color:var(--muted);font-size:12px}
  .chartbox{position:relative;height:300px}
  .chartbox.tall{height:360px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
  th{color:var(--muted);font-weight:600;font-size:12px;cursor:pointer;user-select:none}
  th:first-child,td:first-child{text-align:left}
  tbody tr:hover{background:#f7f8fc}
  .pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;font-weight:600}
  .pill.good{background:#dcfce7;color:#15803d}.pill.mid{background:#fef3c7;color:#b45309}.pill.low{background:#fee2e2;color:#b91c1c}
  .full{grid-column:1/-1}
  .tablewrap{max-height:440px;overflow:auto;border:1px solid var(--line);border-radius:10px}
  .tablewrap table th{position:sticky;top:0;background:#fafbfd;z-index:1}
  .note{font-size:11.5px;color:var(--muted);margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📊 <span id="ttl"></span></h1>
    <span class="month" id="month"></span>
    <span class="gen" id="gen"></span>
  </header>

  <div class="tabs">
    <button class="tab active" data-p="overview">한눈에</button>
    <button class="tab" data-p="brand">브랜드별</button>
    <button class="tab" data-p="media">매체별</button>
    <button class="tab" data-p="daily">일별 추이 · 캠페인 TOP</button>
  </div>

  <!-- 한눈에 -->
  <section class="panel active" id="overview">
    <div class="grid kpis" id="kpiGrid"></div>
    <div class="grid cards">
      <div class="card"><h3>브랜드별 매출 <span class="hint">(어드민 전환 기준)</span></h3><div class="chartbox"><canvas id="ovBrand"></canvas></div></div>
      <div class="card"><h3>광고비 유형 비중 <span class="hint">SA(검색) vs DA(디스플레이)</span></h3><div class="chartbox"><canvas id="ovSADA"></canvas></div></div>
      <div class="card full"><h3>일별 광고비 추이 <span class="hint">전체 / SA / DA</span></h3><div class="chartbox"><canvas id="ovDaily"></canvas></div></div>
    </div>
  </section>

  <!-- 브랜드별 -->
  <section class="panel" id="brand">
    <div class="grid cards">
      <div class="card"><h3>브랜드별 매출 vs 광고비</h3><div class="chartbox tall"><canvas id="brBar"></canvas></div></div>
      <div class="card"><h3>브랜드별 ROAS <span class="hint">매출÷광고비 (배)</span></h3><div class="chartbox tall"><canvas id="brRoas"></canvas></div></div>
      <div class="card full"><h3>브랜드 상세</h3><div class="tablewrap"><table id="brTable"></table></div></div>
    </div>
  </section>

  <!-- 매체별 -->
  <section class="panel" id="media">
    <div class="grid cards">
      <div class="card"><h3>매체별 매출 비중</h3><div class="chartbox tall"><canvas id="mdPie"></canvas></div></div>
      <div class="card"><h3>매체별 ROAS <span class="hint">상위 12개</span></h3><div class="chartbox tall"><canvas id="mdRoas"></canvas></div></div>
      <div class="card full"><h3>매체 상세 <span class="hint">헤더 클릭 시 정렬</span></h3><div class="tablewrap"><table id="mdTable"></table></div></div>
    </div>
  </section>

  <!-- 일별 · 캠페인 -->
  <section class="panel" id="daily">
    <div class="grid cards">
      <div class="card full"><h3>일별 브랜드 광고비 추이 <span class="hint">스택</span></h3><div class="chartbox tall"><canvas id="dyStack"></canvas></div></div>
      <div class="card full"><h3>매출 TOP 10 캠페인</h3><div class="chartbox tall"><canvas id="cpBar"></canvas></div></div>
      <div class="card full"><h3>캠페인 상세 <span class="hint">헤더 클릭 시 정렬 · 상위 40개</span></h3><div class="tablewrap"><table id="cpTable"></table></div></div>
    </div>
  </section>
</div>

<script>
const D = JSON.parse(document.getElementById('DATA').textContent);
const PAL = ['#4f46e5','#10b981','#f59e0b','#f43f5e','#0ea5e9','#8b5cf6','#ec4899','#14b8a6','#f97316','#6366f1','#84cc16','#06b6d4'];
const GRID = '#e7e9ef', INK = '#1a1d29', MUT = '#717684';
const HAS_CHART = typeof Chart !== 'undefined';
if (HAS_CHART){
  Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
  Chart.defaults.color = MUT;
}
// 차트 라이브러리가 차단된 환경에서도 KPI·표는 보이도록 방어. 차트 자리에는 안내를 표시.
function mk(id, cfg){
  const el = document.getElementById(id);
  if (!el) return;
  if (!HAS_CHART){
    const box = el.closest('.chartbox') || el.parentNode;
    box.innerHTML = '<div style="display:flex;height:100%;min-height:120px;align-items:center;justify-content:center;'
      + 'color:var(--muted);font-size:12.5px;text-align:center;padding:16px">차트 라이브러리를 불러오지 못했습니다.<br>'
      + '인터넷이 연결된 브라우저에서 이 파일을 열면 차트가 표시됩니다. (표·수치는 정상 표시)</div>';
    return;
  }
  try { new Chart(el, cfg); }
  catch(e){ console.error('chart', id, e); }
}

// ---- formatters ----
const won = n => {
  n = +n || 0; const s = n<0?'-':''; n = Math.abs(n);
  if (n >= 1e8) return s + (n/1e8).toFixed(n>=1e9?0:1) + '억';
  if (n >= 1e4) return s + Math.round(n/1e4).toLocaleString() + '만';
  return s + Math.round(n).toLocaleString();
};
const wonFull = n => '₩' + Math.round(+n||0).toLocaleString();
const intc = n => Math.round(+n||0).toLocaleString();
const pct = n => (100*(+n||0)).toFixed(2) + '%';
const x1 = n => (+n||0).toFixed(1) + '배';
const WD = ['일','월','화','수','목','금','토'];
const yr = (D.meta.month.match(/(\d{4})/)||[])[1] || new Date().getFullYear();

// ---- header ----
document.getElementById('ttl').textContent = D.meta.title + ' 대시보드';
document.getElementById('month').textContent = D.meta.month;
document.getElementById('gen').textContent = '생성: ' + D.meta.generated + ' · ' + D.meta.days + '일치';

// ---- tabs ----
document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');
  document.getElementById(t.dataset.p).classList.add('active');
});

// ---- KPI cards ----
const roasClass = r => r>=10?'good':r>=3?'mid':'low';
const K = D.kpi;
const kpis = [

  ['총 매출', wonFull(K.매출), won(K.매출)+' · 어드민 전환', 'var(--green)'],
  ['ROAS', x1(K.ROAS), '매출 ÷ 광고비', 'var(--amber)'],
  ['노출수', intc(K.노출), 'Impressions', 'var(--sky)'],
  ['클릭수', intc(K.클릭), '클릭률 '+pct(K.클릭률), 'var(--violet)'],
  ['전환수', intc(K.전환), '전환율 '+pct(K.전환율), 'var(--rose)'],
  ['회원가입', intc(K.회원가입), '신규 가입', 'var(--indigo)'],
  ['CPC', wonFull(K.CPC), '클릭당 비용', 'var(--sky)'],
  ['CPA', wonFull(K.CPA), '전환당 비용', 'var(--amber)'],
  ['객단가', wonFull(K.객단가), '전환당 매출', 'var(--green)'],
];
document.getElementById('kpiGrid').innerHTML = kpis.map(k=>`
  <div class="kpi"><div class="label"><span class="bar" style="background:${k[3]}"></span>${k[0]}</div>
  <div class="val">${k[1]}</div><div class="sub">${k[2]}</div></div>`).join('');

const baseOpts = (extra={}) => Object.assign({
  responsive:true, maintainAspectRatio:false,
  plugins:{legend:{labels:{boxWidth:12,boxHeight:12,padding:14}}},
}, extra);

// ===== 한눈에 =====
mk('ovBrand', {type:'bar', data:{labels:D.brands.map(b=>b.brand),
  datasets:[{label:'매출', data:D.brands.map(b=>b.매출), backgroundColor:PAL, borderRadius:6}]},
  options:baseOpts({plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>wonFull(c.parsed.y)}}},
    scales:{y:{ticks:{callback:won},grid:{color:GRID}},x:{grid:{display:false}}}})});

mk('ovSADA', {type:'doughnut', data:{labels:['SA (검색광고)','DA (디스플레이)'],
  datasets:[{data:[K.SA,K.DA], backgroundColor:['#4f46e5','#0ea5e9'], borderWidth:2, borderColor:'#fff'}]},
  options:baseOpts({cutout:'58%',plugins:{tooltip:{callbacks:{label:c=>c.label+': '+wonFull(c.parsed)+' ('+(100*c.parsed/(K.SA+K.DA)).toFixed(1)+'%)'}}}})});

mk('ovDaily', {data:{labels:D.daily.map(d=>d.date),
  datasets:[
    {type:'line',label:'전체',data:D.daily.map(d=>d.전체),borderColor:'#1a1d29',backgroundColor:'#1a1d29',tension:.3,borderWidth:2,pointRadius:0},
    {type:'line',label:'SA',data:D.daily.map(d=>d.SA),borderColor:'#4f46e5',tension:.3,borderWidth:1.5,pointRadius:0},

    scales:{y:{ticks:{callback:won},grid:{color:GRID}},x:{grid:{display:false}}}})});

// ===== 브랜드별 =====
mk('brBar', {type:'bar',data:{labels:D.brands.map(b=>b.brand),

// ===== sortable table helper =====
function buildTable(el, cols, rows){
  let sortKey=null, asc=false;
  function render(){
    if(sortKey!==null){ rows.sort((a,b)=>{const av=a[sortKey],bv=b[sortKey];
      return (typeof av==='number'? av-bv : (''+av).localeCompare(bv,'ko'))*(asc?1:-1);}); }
    el.innerHTML = '<thead><tr>'+cols.map((c,i)=>`<th data-i="${i}">${c.h}</th>`).join('')+'</tr></thead><tbody>'+
      rows.map(r=>'<tr>'+cols.map(c=>`<td>${c.f(r[c.k],r)}</td>`).join('')+'</tr>').join('')+'</tbody>';
    el.querySelectorAll('th').forEach(th=>th.onclick=()=>{const k=cols[+th.dataset.i].k;
      if(sortKey===k)asc=!asc;else{sortKey=k;asc=false;} render();});
  }
  render();
}
